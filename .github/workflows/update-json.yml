name: Auto Package & Update JSON on Release

on:
  release:
    types: [published]

jobs:
  release-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Main బ్రాంచ్‌ను సరైన Checkout విధానంలోకి తీసుకోవడం
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      # 2. rc-libraries ఫోల్డర్‌ను zip చేయడం
      - name: Build Clean Plugin ZIP
        run: |
          zip -r rc-libraries.zip rc-libraries/

      # 3. Release Assets లోకి ZIP అప్‌లోడ్ చేయడం
      - name: Upload ZIP to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: rc-libraries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. update.json ఫైల్‌ను అప్‌డేట్ చేయడం
      - name: Update update.json File
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/rc-libraries.zip"
          
          jq --arg v "$TAG_NAME" --arg u "$DOWNLOAD_URL" \
            '.version = $v | .download_url = $u' update.json > temp.json && mv temp.json update.json

      # 5. మార్పులను Commit చేసి Main బ్రాంచ్‌కి Push చేయడం
      - name: Commit and Push update.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "auto: update version to ${{ github.event.release.tag_name }}" || exit 0
          git push origin main

      # 6. jsDelivr CDN Cache ని Purge చేయడం (తక్షణ ఆటోమేటిక్ రీఫ్రెష్ కోసం)
      - name: Purge jsDelivr Cache
        run: |
          curl -i https://purge.jsdelivr.net/gh/kprabhupaul/rclibraries/update.json
          curl -i https://purge.jsdelivr.net/gh/kprabhupaul/rclibraries@main/update.json
